# One-click deploy blueprint for Render (https://render.com).
#
#   1. Push this repository to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Render creates the database and web service and generates the secrets.
#   4. Set ADMIN_PASSWORD_HASH (see README) and deploy.
#
# The poll stays closed until you press "Start 24-hour poll" in /admin.

databases:
  - name: mombasa-polls-db
    databaseName: mombasa_polls
    plan: free

services:
  - type: web
    name: mombasa-ni-yetu-polls
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mombasa-polls-db
          property: connectionString
      # Generated once by Render and kept across deploys.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
      - key: ADMIN_USER
        value: admin
      # Required. Produce locally with: npm run keys -- "YourStrongPassword"
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: POLL_HOURS
        value: "24"
      - key: RETENTION_DAYS
        value: "30"
      - key: AUTO_START_POLL
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: OTP_ENABLED
        value: "false"
      - key: CAPTCHA_ENABLED
        value: "false"
